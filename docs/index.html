<style>
/* The house of all the FirmWares: night-blue graph paper, one tile per FirmWare in its own colour. */
:root {
  color-scheme: dark;
  --bg: #090b20; --panel: #10133a; --panel2: #151943; --line: #262a5c; --fg: #ececff; --dim: #a6abd6; --muted: #7a80b0;
  --disp: "Special Elite", "Courier New", monospace; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.7 var(--body); -webkit-font-smoothing: antialiased;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
  background-image: linear-gradient(rgba(150, 165, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(150, 165, 255, .06) 1px, transparent 1px);
  background-size: 36px 36px; mask-image: linear-gradient(to bottom, #000, transparent 90%); -webkit-mask-image: linear-gradient(to bottom, #000, transparent 90%); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .05; background: repeating-linear-gradient(to bottom, #fff 0 1px, transparent 1px 3px); }
main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(28px, 6vh, 56px); min-height: calc(100vh - 44px); min-height: calc(100svh - 44px); justify-content: flex-start; }
main > section { margin: auto 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid #cdffb9; outline-offset: 3px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--dim); font: 400 14px var(--mono); letter-spacing: .14em; white-space: nowrap; }
.top .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #cdffb9; box-shadow: 0 0 12px #cdffb9; margin-right: 10px; animation: blink 3.2s steps(1) infinite; }
@keyframes blink { 0%, 86%, 100% { opacity: 1; } 90%, 96% { opacity: .15; } }
.lang button { background: none; border: 0; padding: 4px 6px; cursor: pointer; font: 400 14px var(--mono); letter-spacing: .14em; color: var(--muted); }
.lang button[aria-pressed=true] { color: #cdffb9; }




h1 { font: 400 clamp(30px, 6vw, 52px)/.95 var(--disp); letter-spacing: -.04em; margin: 0; }
h1 .d { color: var(--muted); }
.lead { margin: 0; max-width: 40em; color: #fff; font: 400 clamp(19px, 2.4vw, 22px)/1.6 var(--body); text-wrap: pretty; }
.intro { width: 100%; display: flex; flex-direction: column; gap: 12px; color: #fff; font: 400 14px/1.65 var(--body); }
.intro p { margin: 0; text-wrap: pretty; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(14px, 2.4vw, 28px); }
.tile { --c: #ff7dcd; display: flex; flex-direction: column; gap: 16px; text-decoration: none; }
/* like the Instagram logo: clean violet outline at rest, the colour of the FirmWare's first letter on hover, nothing glowing behind */
.crt { position: relative; border-radius: clamp(16px, 3vw, 26px); background: #090b20; overflow: hidden; }
.crt::after { content: ""; position: absolute; inset: 0; z-index: 2; background: var(--c); opacity: 0; pointer-events: none; transition: opacity .15s; }
a.tile { cursor: pointer; }
.tile:hover .crt::after, .tile:active .crt::after, a.tile:focus-visible .crt::after { opacity: .22; }
.crt .sc { position: relative; aspect-ratio: 1; overflow: hidden; background: #090b20; }
.crt canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.arp-sp { position: absolute; inset: 0; background: #090b20; }
.arp-sp img { position: absolute; left: 50%; transform: translateX(-50%); image-rendering: pixelated; opacity: 0; }
.nm { font: 400 clamp(15px, 2.2vw, 19px) var(--mono); letter-spacing: .24em; text-align: center; color: var(--c); }
.tile.soon .nm { color: var(--muted); }
.ig-ico { display: inline-block; line-height: 0; transition: transform .1s; }
.ig-ico svg { width: 44px; height: 44px; display: block; }
.ig-ico .ln { fill: none; stroke: #7a4fe0; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; transition: stroke .15s; }
.ig-ico .dt { fill: #7a4fe0; stroke: none; transition: fill .15s; }
.ig-ico:hover .ln, .ig-ico:active .ln, .ig-ico:focus-visible .ln { stroke: #ff5cbd; }
.ig-ico:hover .dt, .ig-ico:active .dt, .ig-ico:focus-visible .dt { fill: #ff5cbd; }
.ig-ico:active { transform: translateY(1px); }
.ig-ico:focus-visible { outline: none; }
.ico-row { display: flex; justify-content: flex-start; align-items: center; }
.closing { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-direction: column; gap: 14px; }
.closing p { margin: 0; max-width: 40em; text-wrap: pretty; }
.links { display: flex; flex-wrap: wrap; gap: 12px 26px; font: 400 15px var(--mono); letter-spacing: .08em; }
.links a { color: var(--dim); }
.links a:hover { color: var(--fg); }
footer { color: var(--muted); font: 400 14px/1.9 var(--mono); letter-spacing: .08em; border-top: 1px solid var(--line); padding-top: 26px; }

@media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 440px; margin: 0 auto; width: 100%; } .top { font-size: 12px; } .crt { border-radius: 16px; } }
@media (prefers-reduced-motion: reduce) { .top .led { animation: none; } .tile { transition: none; } }
</style>
</head>
