<style>
/* The house of all the FirmWares: night-blue graph paper, one tile per FirmWare in its own colour. */
:root {
  color-scheme: dark;
  --bg: #090b20; --panel: #10133a; --panel2: #151943; --line: #262a5c; --fg: #ececff; --dim: #a6abd6; --muted: #7a80b0;
  --disp: "IBM Plex Sans", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.7 var(--body); -webkit-font-smoothing: antialiased;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
  background-image: linear-gradient(rgba(150, 165, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(150, 165, 255, .06) 1px, transparent 1px);
  background-size: 36px 36px; mask-image: linear-gradient(to bottom, #000, transparent 90%); -webkit-mask-image: linear-gradient(to bottom, #000, transparent 90%); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .05; background: repeating-linear-gradient(to bottom, #fff 0 1px, transparent 1px 3px); }

.crt { position: relative; border-radius: clamp(16px, 3vw, 26px); background: #090b20; overflow: hidden; }

<script>
(function () {
  var D = {
    en: { h1: "M-Vave has opened the Fm-1 to Vibe Coding. This let me completely rethink the system of this little machine.", i1: "I develop minimalist and instinctive FirmWares. Many keys and functions are disabled.<br>I regularly post videos on Instagram. See you soon.", c3: "You can follow what I do on Instagram. See you soon!" }, fr: { h1: "M-Vave a ouvert le Fm-1 au Vibe Coding. Ainsi, j\u2019ai pu repenser compl\u00e8tement le syst\u00e8me de cette petite machine.", i1: "Je d\u00e9veloppe des FirmWares minimalistes et instinctifs. Beaucoup de touches et de fonctions sont d\u00e9sactiv\u00e9es.<br>Je poste r\u00e9guli\u00e8rement des vid\u00e9os sur Instagram. \u00c0 bient\u00f4t.", c3: "Tu peux suivre ce que je fais sur Instagram. \u00c0 bient\u00f4t !" }
  };
  var lang = "en";
  try { var s = localStorage.getItem("lang"); if (s === "fr" || s === "en") lang = s;; } catch (e) {}
  function apply() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-i]"); for (var q = 0; q < els.length; q++) { var v = D[lang][els[q].getAttribute("data-i")]; if (v != null) els[q].innerHTML = v; }
    var bs = document.querySelectorAll(".lang button"); for (var b = 0; b < bs.length; b++) bs[b].setAttribute("aria-pressed", bs[b].getAttribute("data-l") === lang ? "true" : "false");
  }
  var bs = document.querySelectorAll(".lang button");
  for (var b = 0; b < bs.length; b++) bs[b].addEventListener("click", function () { lang = this.getAttribute("data-l"); try { localStorage.setItem("lang", lang); } catch (e) {} apply(); });
  apply();

  /* Start screens: oscilloscope ground, dot-matrix name on two lines, neon that struggles to light up (no glow) */
  (function () {
    var G = {
      A:"01110,10001,10001,11111,10001,10001,10001", R:"11110,10001,10001,11110,10100,10010,10001",
      P:"11110,10001,10001,11110,10000,10000,10000", V:"10001,10001,10001,10001,10001,01010,00100", W:"10001,10001,10001,10101,10101,11011,10001",
      S:"01111,10000,10000,01110,00001,00001,11110", C:"01110,10001,10000,10000,10000,10001,01110",
      G:"01110,10001,10000,10111,10001,10001,01111", E:"11111,10000,10000,11110,10000,10000,11111",
      N:"10001,11001,10101,10101,10011,10001,10001", T:"11111,00100,00100,00100,00100,00100,00100",
      H:"10001,10001,10001,11111,10001,10001,10001", O:"01110,10001,10001,10001,10001,10001,01110",
      M:"10001,11011,10101,10101,10001,10001,10001"
    };
    var TILES = [
      ["t-arp", "ARP", "#ff7dcd", "WAV", "#70aaff", 0],
      ["t-hnt", "HNT", "#b2309c", "HOM", "#8c82ff", 1700],
      ["t-spc", "SPC", "#8fd0ff", "GEN", "#c0ffd6", 3400],
      ["t-snt", "SNT", "#ffb870", "WAV", "#ffd9a8", 5100]
    ];
    var CYC = 11000, ON0 = 700, STEP = 450, FL = 2000, OFF_AT = 9600;
    function hash(a, b) { var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var list = [];
    TILES.forEach(function (T) {
      var cv = document.getElementById(T[0]); if (!cv) return;
      list.push({ cv: cv, cx: cv.getContext("2d"), T: T });
    });
    var PX = 11, BL = 9, ROWS = 7, COLS = 5, GAP = 1, LGAP = 1;
    var W3 = 3 * COLS + 2 * GAP, H2 = 2 * ROWS + LGAP;
    var X0 = Math.round((240 - W3 * PX) / 2), Y0 = Math.round((240 - H2 * PX) / 2);
    function level(i, t, seed) {
      if (reduce) return 1;
      if (t >= OFF_AT) return Math.max(0, 1 - (t - OFF_AT) / 900);
      var st = ON0 + i * STEP; if (t < st) return 0;
      var u = Math.min(1, (t - st) / FL), e = u * u * (3 - 2 * u);
      var dip = (1 - u) * .5 * (.5 + .5 * Math.sin(u * 11 + i * 1.7 + seed * 9));
      return Math.max(0, e * (1 - dip));
    }
    function frame(o, t) {
      var c = o.cx, T = o.T; c.setTransform(2, 0, 0, 2, 0, 0);
      c.fillStyle = "#090b20"; c.fillRect(0, 0, 240, 240);
      /* scope graticule */
      c.strokeStyle = "rgba(112,130,255,.10)"; c.lineWidth = 1; c.beginPath();
      for (var g = 1; g < 8; g++) { var v = Math.round(g * 30) + .5; c.moveTo(v, 0); c.lineTo(v, 240); c.moveTo(0, v); c.lineTo(240, v); }
      c.stroke();
      c.strokeStyle = "rgba(112,130,255,.22)"; c.beginPath(); c.moveTo(120.5, 0); c.lineTo(120.5, 240); c.moveTo(0, 120.5); c.lineTo(240, 120.5); c.stroke();
      c.fillStyle = "rgba(112,130,255,.22)";
      for (var k = 0; k <= 240; k += 12) { c.fillRect(k, 118, 1, 5); c.fillRect(118, k, 5, 1); }
      /* two words, 3 letters each, dot-matrix */
      for (var w = 0; w < 2; w++) {
        var word = w ? T[3] : T[1], col = w ? T[4] : T[2];
        for (var l = 0; l < 3; l++) {
          var rows = G[word.charAt(l)].split(","), lv = level(w * 3 + l, (t + T[5] * 0) % CYC, T[5] * .001);
          var ox = X0 + l * (COLS + GAP) * PX, oy = Y0 + w * (ROWS + LGAP) * PX;
          for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
            var on = rows[y].charAt(x) === "1";
            c.globalAlpha = on ? .07 + .93 * lv : .035;
            c.fillStyle = col; c.fillRect(ox + x * PX, oy + y * PX, BL, BL);
          }
        }
      }
      c.globalAlpha = 1;
    }
    var t0 = performance.now();
    function loop(now) { var t = (now - t0) % CYC; list.forEach(function (o) { frame(o, t); }); requestAnimationFrame(loop); }
    list.forEach(function (o) { o.cv.width = 480; o.cv.height = 480; });
    if (reduce) list.forEach(function (o) { frame(o, 5000); }); else requestAnimationFrame(loop);
  })();
