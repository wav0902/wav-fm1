/* Layout: the FM-1 drawn from its photo (1000 x 613): knobs top, screen centre, 12 buttons right, 27 keys along the bottom.
   Colours are sampled from that photo. The page around it is a dark ground. */
:root {
  color-scheme: dark;
  --bg: #090b20; --ink: #e8e9ff; --dim: #a2a7d6; --edge: #262a5c; --green: #cdffb9; --acc: #ff7dcd; --bass: #70aaff;
  --body: #b770c2; --body-hi: #c286cb; --recess: #4a3480; --kpanel: #4a3480; --btn: #4f3585; --btn-hi: #624996;
  --pill: #4f3585; --slot: #f9f8fa; --knob: #1c1b1a; --bezel: #070709; --plabel: #fbf7ff; --red: #e0503f; --dot: #201d3f;
  --f-lcd: &quot;Share Tech Mono&quot;, &quot;Courier New&quot;, monospace;
  --f-ui: &quot;Barlow Condensed&quot;, &quot;Arial Narrow&quot;, Arial, sans-serif;
  --f-disp: &quot;Special Elite&quot;, &quot;Courier New&quot;, monospace; --f-mono: &quot;IBM Plex Mono&quot;, ui-monospace, monospace;
  --f-hw: &quot;Nunito&quot;, &quot;Segoe UI&quot;, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font: 400 clamp(40px, 8vw, 64px)/1 var(--f-disp); }
h1 .a { color: var(--acc); } h1 .w { color: var(--bass); } h1 .n { color: var(--green); }
.sub { margin: 10px 0 0; color: var(--dim); font-size: 17px; letter-spacing: .03em; }
.row2 { margin-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.go { width: 6.6em; text-align: center; appearance: none; border: 0; background: #7a4fe0; color: #fff; font: 700 18px var(--f-ui); letter-spacing: .02em; padding: 7px 0; border-radius: 6px; cursor: pointer; transition: background .15s, transform .1s; }
.go.alt { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
.go:hover { background: #8a64ea; }
.go:active { transform: translateY(1px); }
.go.on { background: #ff5cbd; color: #fff; }
.go:disabled { opacity: .5; cursor: default; }
.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
